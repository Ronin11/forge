[package]
name = "forge-client"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "The one Rust client of the forge CLI: resolves the forge binary, runs verbs, and parses their --json output into typed rows, per docs/CLIENT.md."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
