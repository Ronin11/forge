[workspace]
members = ["tui", "repomap", "web", "client", "portal", "forge-test"]

[package]
name = "forge"
license = "MIT"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
forge-test = { path = "forge-test" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "signal", "sync", "fs"] }
jsonschema = { version = "0.56.0", default-features = false }
croner = "=4.0.0"
chrono = { version = "=0.4.45", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
chacha20poly1305 = "0.10"
rpassword = "7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
forge-client = { path = "client" }
tiny_http = "0.12"
