[workspace]
members = ["tui", "repomap", "web", "client", "portal"]

[package]
name = "forge"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "sync", "fs"] }

[dev-dependencies]
tempfile = "3"
forge-client = { path = "client" }
