[package]
name = "forge-tui"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "A terminal client for Forge. Speaks only the JSON the forge CLI emits and acts only through forge verbs."

[lib]
name = "forge_tui"
path = "src/lib.rs"

[[bin]]
name = "forge-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
forge-client = { path = "../client" }
libc = "0.2"
ratatui = "0.30"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
