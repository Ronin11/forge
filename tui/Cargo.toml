[package]
name = "forge-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal client for Forge 2. Speaks only the JSON the forge CLI emits and acts only through forge verbs."

[[bin]]
name = "forge-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
forge-client = { path = "../client" }
ratatui = "0.30"
serde_json = "1"
