# The gate, on GitHub: every push to main and every PR runs `just check` — the
# same recipe that gates milestones locally — plus a cross-compile of every
# release target so a portability regression fails here, not on tag day.
# release.yml calls this workflow before building binaries.
#
# Submodules: the base library (go:embed needs it), the site, and the plugins
# module ride along. Their URLs are ssh, which actions/checkout rewrites to
# https with its token. GITHUB_TOKEN only reaches THIS repository, so while
# the submodule repos are private a fine-grained PAT with contents:read on
# Ronin11/{forge,forge-library,forge-plugins,ashbyforge} must be stored as the
# SUBMODULE_TOKEN secret. Once they are public the fallback token suffices and
# the secret can be deleted.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Forge commits to main on its own all day (29 commits in the 24 hours before
# this pipeline existed), and the gate takes 20-25 minutes on a runner. Cancel
# a superseded run rather than gating every intermediate commit: the newest
# commit's run covers the ones it was stacked on. Tag runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    # Self-hosted: the reference laptop. It is 6x faster than a GitHub runner on
    # the SQLite benchmark and costs no Actions minutes, which matters because
    # Forge commits to main on its own all day. The guard below is the price of
    # that: a self-hosted runner executes the workflow as this user, so a pull
    # request from a fork must never reach it. Same-repo events only.
    runs-on: [self-hosted, linux, x64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe wants tags for the build version
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            plugins/go.sum

      - uses: extractions/setup-just@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `just ui-test` skips itself when chromium is absent; install it here so
      # the browser tests actually run. No --with-deps: that installs system
      # packages with sudo, which a self-hosted runner should not be doing, and
      # the desktop this runs on already has the libraries.
      - name: Install Playwright chromium
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: just check
        run: just check
        env:
          # A self-hosted runner shares HOME with the operator, so the gate would
          # otherwise read and reach the LIVE ~/.forge: `kb check` graded Nate's
          # real knowledge base (and failed on a dangling link that has nothing
          # to do with the commit), and any forge command would find the running
          # daemon's socket. Point FORGE_HOME at scratch so CI is hermetic. The
          # tests and the eval harness already isolate themselves; this covers
          # the recipes that shell out to ./forge directly.
          FORGE_HOME: ${{ runner.temp }}/forge-home
          # This IS the reference laptop bench/threshold.txt was calibrated on,
          # so the ceilings apply almost as written. 2x absorbs the daemon and
          # the worker competing for the same cores mid-run. A GitHub-hosted
          # runner needs 8. See scripts/bench-check.sh.
          BENCH_SCALE: 2

      - name: Cross-compile release targets
        run: just cross

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore
