name: Release

# A `v*` tag builds the release archive scripts/release.sh packs (the
# binaries, both units, the config template) and attaches it, with its
# SHA256SUMS, to a GitHub release of the same name. `forge upgrade <url>`
# installs from those two files. The tag must equal what the built
# `forge version` reports: the archive is named from the binary, never
# from the tag, and the two are checked against each other before upload.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build and pack
        run: scripts/release.sh ${{ matrix.target }}

      - name: The tag names the version the binary reports
        run: |
          version="$(target/${{ matrix.target }}/release/forge version | cut -d' ' -f1)"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but the binary is $version" >&2; exit 1; }
          ls -la dist/

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/forge-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
