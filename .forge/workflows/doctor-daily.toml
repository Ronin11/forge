name = "doctor-daily"
kind = "run"
description = "daily unattended `forge doctor --json` at 07:00: every WARN or FAIL row becomes an effect, disk space and log volume are kept in bounds by disk-and-logs.toml (spliced in), and a FAIL blocks the run and asks the operator (docs/JOBS.md, docs/CHECKS.md)."

steps = [
  { action = "doctor-json-to-effects", effect = "row" },
  { workflow = "disk-and-logs" },
]

[trigger]
on = "schedule"
cron = "0 7 * * *"

[assert]
clean = ["bash", "-c", "! grep -q $'\\tFAIL:' \"$FORGE_EFFECT_LOG\""]

[skip_if]
already_ran = ["bash", "-c", "home=\"${FORGE2_HOME:-$HOME/.local/share/forge2}\"; marker=\"$home/doctor-daily/last-ok\"; [ -f \"$marker\" ] && [ \"$(cat \"$marker\")\" = \"$(date -u +%Y-%m-%d)\" ] && echo \"doctor already ran clean today\""]

[limits]
budget_usd = 0.0
per_day = 2
on_failure = "ask:operator"
