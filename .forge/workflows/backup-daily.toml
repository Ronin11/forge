name = "backup-daily"
kind = "run"
description = "daily unattended backup of the store at 03:30 UTC: a consistent sqlite3 .backup copy of FORGE_HOME/forge.db and FORGE_HOME/config.toml go to the equitizr host (ssh host equitizr, ~/backups/forge/<date>/) with rsync, the remote copy must pass `pragma integrity_check`, and the seven newest dated directories are kept. One file effect per copy; a dry run logs what it would copy and touches nothing remote. A failure asks the operator (docs/OPS.md)."

steps = [
  { action = "backup-store", effect = "file" },
]

[trigger]
on = "schedule"
cron = "30 3 * * *"

[assert]
copied = ["bash", "-c", "grep -q '^file' \"$FORGE_EFFECT_LOG\""]

[limits]
budget_usd = 0.0
per_day = 6
on_failure = "ask:operator"
