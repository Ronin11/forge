name = "check-model-drift"
kind = "operation"
description = "reads the `model` field of the `system`/`init` frame (and `message.model` of assistant frames) in every attempt log under FORGE_HOME/logs (FORGE_HOME from the job's environment, or $HOME/.local/share/forge by default), buckets each id it names by model family (opus/sonnet/haiku) and by the week its log was written, and logs a row effect for a family whose resolved model id this week differs from last week's."
run = ["bash", "-c", '''
set +e
home="${FORGE_HOME:-$HOME/.local/share/forge}"
logs="$home/logs"
now=$(date +%s)
week=$((7*24*3600))
this_start=$((now - week))
last_start=$((now - 2*week))

family() {
  case "$1" in
    *opus*) echo opus ;;
    *sonnet*) echo sonnet ;;
    *haiku*) echo haiku ;;
    *) echo other ;;
  esac
}

declare -A this_week
declare -A last_week

if [ -d "$logs" ]; then
  while IFS=' ' read -r mtime path; do
    [ -z "$path" ] && continue
    mtime_i=${mtime%.*}
    while IFS= read -r model; do
      [ -z "$model" ] && continue
      fam=$(family "$model")
      if [ "$mtime_i" -ge "$this_start" ]; then
        this_week["$fam"]="$model"
      elif [ "$mtime_i" -ge "$last_start" ]; then
        last_week["$fam"]="$model"
      fi
    done < <(jq -r 'if .type=="system" and .subtype=="init" then (.model // empty) elif .type=="assistant" then (.message.model // empty) else empty end' "$path" 2>/dev/null)
  done < <(find "$logs" -maxdepth 1 -type f -name '*.jsonl' -printf '%T@ %p\n' 2>/dev/null | sort -n)
fi

suffix=""
[ "${FORGE_DRY_RUN:-}" = "1" ] && suffix=" (dry run)"
for fam in opus sonnet haiku other; do
  cur="${this_week[$fam]:-}"
  prev="${last_week[$fam]:-}"
  if [ -n "$cur" ] && [ -n "$prev" ] && [ "$cur" != "$prev" ]; then
    printf "row\t%s\t%s%s\n" "$fam" "$fam resolved to $prev last week, $cur this week" "$suffix" >> "$FORGE_EFFECT_LOG"
  fi
done
exit 0
''']
