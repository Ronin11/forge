name = "check-model-drift"
kind = "operation"
description = "reads the `model` field of the result frame in every attempt log under FORGE2_HOME/logs (FORGE2_HOME from the job's environment, or $HOME/.local/share/forge2 by default), buckets each by the model family (opus/sonnet/haiku) it named and by the week its log was written, and logs a row effect for a family whose resolved model id this week differs from last week's."
run = ["bash", "-c", '''
set +e
home="${FORGE2_HOME:-$HOME/.local/share/forge2}"
logs="$home/logs"
now=$(date +%s)
week=$((7*24*3600))
this_start=$((now - week))
last_start=$((now - 2*week))

family() {
  case "$1" in
    *opus*) echo opus ;;
    *sonnet*) echo sonnet ;;
    *haiku*) echo haiku ;;
    *) echo other ;;
  esac
}

declare -A this_week
declare -A last_week

if [ -d "$logs" ]; then
  while IFS=' ' read -r mtime path; do
    [ -z "$path" ] && continue
    model=$(jq -r 'select(.type=="result") | .model // empty' "$path" 2>/dev/null | tail -n1)
    [ -z "$model" ] && continue
    fam=$(family "$model")
    mtime_i=${mtime%.*}
    if [ "$mtime_i" -ge "$this_start" ]; then
      this_week["$fam"]="$model"
    elif [ "$mtime_i" -ge "$last_start" ]; then
      last_week["$fam"]="$model"
    fi
  done < <(find "$logs" -maxdepth 1 -type f -name '*.jsonl' -printf '%T@ %p\n' 2>/dev/null | sort -n)
fi

suffix=""
[ "${FORGE_DRY_RUN:-}" = "1" ] && suffix=" (dry run)"
for fam in opus sonnet haiku other; do
  cur="${this_week[$fam]:-}"
  prev="${last_week[$fam]:-}"
  if [ -n "$cur" ] && [ -n "$prev" ] && [ "$cur" != "$prev" ]; then
    printf "row\t%s\t%s%s\n" "$fam" "$fam resolved to $prev last week, $cur this week" "$suffix" >> "$FORGE_EFFECT_LOG"
  fi
done
exit 0
''']
