name = "review-if-crossed"
kind = "operation"
description = "reads measurements.json against this workflow's [env] thresholds (FUNCTION_MAX_LINES, aliased by RUN_TASK_MAX_LINES; SRC_FILE_MAX_LINES) plus modules without tests and clippy warnings; when any is crossed, files one task on the project through forge add naming every crossing and carrying the measurements, asking for a review in the shape of docs/REVIEW-2.md — a dry run only logs what it would have filed"
run = ["bash", ".forge/workflows/actions/compare-thresholds.sh"]
