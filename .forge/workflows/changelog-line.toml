name = "changelog-line"
kind = "run"
description = "a landed task's text and diff stat become a one-line changelog entry, appended to CHANGELOG.md — the first bounded judgment measured across providers (docs/JOBS.md, \"Steps\")"

steps = [
  { action = "summarise-changelog-line", role = "summarise", judgment = "writing one sentence that says what a change means is not a pattern a script can match" },
  { action = "append-changelog-line",    effect = "file" },
]

[trigger]
on = "manual"

[assert]
appended = ["bash", "-c", "grep -q '^file' \"$FORGE_EFFECT_LOG\""]

[limits]
budget_usd = 0.60
per_day = 50
on_failure = "ask:operator"
