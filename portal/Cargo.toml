[package]
name = "forge-portal"
version = "0.1.0"
edition = "2024"
description = "The customer portal: a read-only page at /p/<token> showing one project's work in plain words (see docs/PORTAL.md)."

[[bin]]
name = "forge-portal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
forge-client = { path = "../client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
