name = "repo-map"
kind = "operation"
description = "where things are: every source file's declared symbols, ranked against the task's words and the files earlier work read most, cut to a budget; shown to the next directive so it starts by reading what matters instead of finding it. Deterministic: forge-repomap, no model."
consumes = ["branch"]
produces = ["context"]
run = ["bash", "-c", '''
# Two parts, split by the marker prompts.rs knows: the map ranked without
# the task's words (shared by every task on this base, so the model's
# prompt cache serves it), then a short list ranked by them (this task's
# own). See docs/CONTEXT.md, "The order of a prompt".
spans=""
[ "${FORGE_MAP_STYLE:-spans}" = "names" ] && spans="--no-spans"
"$FORGE_BIN_DIR/forge-repomap" rank --dir . --task "" --budget 5200 $spans --hot "$FORGE_HOT_FILES" --cache "$FORGE_CACHE_DIR/repomap" --changed-since "$FORGE_BASE_SHA"
printf '\n---task---\n'
exec "$FORGE_BIN_DIR/forge-repomap" rank --dir . --task "$FORGE_TASK" --budget 800 $spans --hot "$FORGE_HOT_FILES" --cache "$FORGE_CACHE_DIR/repomap"
''', "repo-map"]
