name = "deploy-self"
kind = "operation"
description = "deploy Forge itself on this machine through the release layout (docs/OPS.md, 'The running binary'): under a lock, builds the landed tree (archived by `forge deploy` from origin, never the registered checkout) with `cargo build --release --workspace` into the build cache FORGE_HOME/bin/target, copies its binaries into FORGE_HOME/bin/releases/<sha>/ (skipped when that release already exists), runs that release's own `forge doctor --json` against a scratch FORGE_HOME and requires its schema check to pass, then writes FORGE_HOME/bin/staged -> releases/<sha>. Until the worker starts a successor on staged itself, it then flips FORGE_HOME/bin/current to the release (previous keeps the old one), restarts the web and portal units (arg units, default 'forge-web forge-portal') and waits for them to be active, runs the target's check with bounded retries (default: curl the web client's /tasks, arg url, with the token from FORGE_HOME/web.token, expecting 200), and only then asks the worker unit (arg worker, default forge-worker) to restart with `systemctl --user restart --no-block`, last. A failed build, doctor or check puts current, previous and staged back, removes a release this run created, restarts the units on the old release, leaves the worker alone and exits non-zero. Optional arg tries (default 40) bounds each wait, half a second apart. Reads its args and the check command from the environment, injected there by `forge deploy` from the target's own record, and the commit as FORGE_DEPLOY_SHA (see docs/DEPLOY.md, 'Deploying Forge itself')."
run = ["bash", "-c", '''
set -euo pipefail
sha="${FORGE_DEPLOY_SHA:-}"
if [ -z "$sha" ]; then
  echo "deploy-self: no FORGE_DEPLOY_SHA (the landed commit to build)" >&2
  exit 1
fi
if [ ! -f Cargo.toml ]; then
  echo "deploy-self: the tree of ${sha:0:8} is not a cargo workspace" >&2
  exit 1
fi
units="${FORGE_ARG_UNITS:-forge-web forge-portal}"
units="${units//,/ }"
worker="${FORGE_ARG_WORKER:-forge-worker}"
url="${FORGE_ARG_URL:-http://127.0.0.1:7788/tasks}"
tries="${FORGE_ARG_TRIES:-40}"
# The data directory under either name: the kernel that runs this script
# during a self-deploy is the one being replaced, so for one release it
# may still export FORGE2_HOME (the rename, 2026-09-22), and the
# directory may still carry the old name.
home="${FORGE_HOME:-${FORGE2_HOME:-}}"
if [ -z "$home" ]; then
  if [ -d "$HOME/.local/share/forge" ]; then home="$HOME/.local/share/forge"; else home="$HOME/.local/share/forge2"; fi
fi
# An operation's environment is cleared; `systemctl --user` needs this to
# find the user manager.
export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
required="forge forge-web forge-portal forge-repomap forge-tui"
bins="$required forge-test"
root="$home/bin"
target="$root/target"
release="$root/releases/$sha"
mkdir -p "$root/releases"

# One self-deploy at a time: two landings finishing together must not
# build into the same cache or flip the same pointers.
exec 9>"$root/.deploy-self.lock"
if ! flock -w 600 9; then
  echo "deploy-self: another self-deploy held $root/.deploy-self.lock for ten minutes" >&2
  exit 1
fi

# The pointers as they are, to put back on failure.
was_current="$(readlink "$root/current" 2>/dev/null || true)"
was_previous="$(readlink "$root/previous" 2>/dev/null || true)"
was_staged="$(readlink "$root/staged" 2>/dev/null || true)"
point() { # <name> <link target or empty>
  if [ -z "$2" ]; then
    rm -f "$root/$1"
    return
  fi
  ln -sfn "$2" "$root/.$1.new"
  mv -T "$root/.$1.new" "$root/$1"
}
created=0
doctor_home=""
restore() {
  echo "deploy-self: putting current back to ${was_current:-nothing}" >&2
  point current "$was_current"
  point previous "$was_previous"
  point staged "$was_staged"
  if [ "$created" = 1 ] && [ "releases/$sha" != "$was_current" ]; then
    rm -rf "$release"
  fi
  if [ -n "$was_current" ]; then
    systemctl --user restart $units || true
  fi
}
armed=1
on_exit() {
  rc=$?
  if [ -n "$doctor_home" ]; then rm -rf "$doctor_home"; fi
  if [ "$rc" -ne 0 ] && [ "$armed" = 1 ]; then
    restore || true
  fi
  exit "$rc"
}
trap on_exit EXIT

if [ -x "$release/forge" ]; then
  echo "release ${sha:0:8} is already built at $release"
else
  # The archive has no .git; build.rs takes the commit from here.
  export FORGE_BUILD_SHA="${sha:0:7}"
  CARGO_TARGET_DIR="$target" cargo build --release --workspace
  for b in $required; do
    if [ ! -x "$target/release/$b" ]; then
      echo "deploy-self: the build produced no $target/release/$b" >&2
      exit 1
    fi
  done
  # A release is never overwritten and never half-written: copy into a
  # temporary directory, then rename it into place.
  tmp="$root/releases/.$sha.tmp"
  rm -rf "$tmp"
  mkdir -p "$tmp"
  for b in $bins; do
    if [ -x "$target/release/$b" ]; then cp -p "$target/release/$b" "$tmp/$b"; fi
  done
  mv -T "$tmp" "$release"
  created=1
  echo "built ${sha:0:8} into $release"
fi

# The new binary's own doctor, against a scratch home: its migration
# ladder runs on an empty store, never on the live one. Doctor exits
# non-zero for any FAIL a bare home has (no agent login, say); what must
# pass is the schema check.
doctor_home="$(mktemp -d "$root/.doctor.XXXXXX")"
doctor_out="$(FORGE_HOME="$doctor_home" "$release/forge" doctor --json 2>&1 || true)"
if ! printf '%s' "$doctor_out" | tr -d ' \n' | grep -q '"name":"schema","status":"ok"'; then
  echo "deploy-self: ${sha:0:8}'s own doctor did not pass its schema check against a scratch home:" >&2
  printf '%s\n' "$doctor_out" | tail -c 2000 >&2
  exit 1
fi
echo "doctor of ${sha:0:8}: schema ok against a scratch home"

point staged "releases/$sha"
echo "staged ${sha:0:8}: $root/staged -> releases/$sha"

# Until the worker starts a successor on staged itself, go live the way
# every deploy has: flip current, restart web and portal, check, then the
# worker last.
if [ "$was_current" != "releases/$sha" ]; then
  if [ -n "$was_current" ]; then point previous "$was_current"; fi
  point current "releases/$sha"
fi
echo "current -> releases/$sha (previous: $(readlink "$root/previous" 2>/dev/null || echo none))"
live="$(readlink -f "$HOME/.local/bin/forge" 2>/dev/null || true)"
case "$live" in
  "$root"/releases/*|"") ;;
  *) echo "deploy-self: warning: $HOME/.local/bin/forge is $live, not through $root/current; run forge init --relink once" >&2 ;;
esac

systemctl --user restart $units
for u in $units; do
  n=0
  until [ "$(systemctl --user is-active "$u" || true)" = "active" ]; do
    n=$((n + 1))
    if [ "$n" -ge "$tries" ]; then
      echo "deploy-self: $u did not become active" >&2
      exit 1
    fi
    sleep 0.5
  done
  echo "$u is active"
done

check() {
  if [ -n "${FORGE_CHECK:-}" ]; then
    bash -c "$FORGE_CHECK"
    return
  fi
  code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(cat "$home/web.token")" "$url" || true)"
  echo "GET $url: ${code:-no answer}"
  [ "$code" = "200" ]
}
n=0
until check; do
  n=$((n + 1))
  if [ "$n" -ge "$tries" ]; then
    echo "deploy-self: the check did not pass after $n tries" >&2
    exit 1
  fi
  sleep 0.5
done

# The worker is the process running this very deploy (a landing calls
# it), so it is restarted last and without waiting: systemd's SIGTERM
# makes it drain, this method returns, the landing finishes its own
# records, and only then does the worker exit and start again on the new
# binary. Past the check, a failed restart is not a bad build.
armed=0
systemctl --user restart --no-block "$worker"
echo "asked $worker to restart once its running attempts finish"
''', "deploy-self"]
