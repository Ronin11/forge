name = "deploy-user-service"
kind = "operation"
description = "deploy-command plus a user-level systemd unit: rsync's the landed tree (or an optional build_dir within it) to host:dest over ssh, runs the optional command there, restarts the unit with `systemctl --user restart <unit>`, waits (bounded) until `systemctl --user is-active <unit>` reports active, then runs the target's check there and reports its exit status. Host 'local' skips ssh and runs everything on this machine. Reads its args (host, dest, unit, and optionally command, build_dir, and exclude, a comma-separated list of rsync exclude patterns) and the check command from the environment, injected there by `forge deploy` from the target's own record (see docs/DEPLOY.md, 'Secrets and hosts')."
run = ["bash", "-c", '''
set -e
host="$FORGE_ARG_HOST"
dest="$FORGE_ARG_DEST"
cmd="$FORGE_ARG_COMMAND"
unit="$FORGE_ARG_UNIT"
src="."
if [ -n "$FORGE_ARG_BUILD_DIR" ]; then
  src="$FORGE_ARG_BUILD_DIR"
fi
exclude_args=()
if [ -n "$FORGE_ARG_EXCLUDE" ]; then
  IFS=',' read -ra patterns <<< "$FORGE_ARG_EXCLUDE"
  for p in "${patterns[@]}"; do
    exclude_args+=(--exclude "$p")
  done
fi
if [ -z "$unit" ]; then
  echo "deploy-user-service: no unit arg" >&2
  exit 1
fi
run_remote() {
  if [ "$host" = "local" ]; then
    bash -c "$1"
  else
    ssh "$host" "$1"
  fi
}
if [ "$host" = "local" ]; then
  mkdir -p "$dest"
  rsync -a --delete "${exclude_args[@]}" "$src"/ "$dest"/
  echo "copied $src to $dest (local)"
else
  rsync -a --delete "${exclude_args[@]}" "$src"/ "$host:$dest"/
  echo "copied $src to $host:$dest"
fi
if [ -n "$cmd" ]; then
  run_remote "cd \"$dest\" && $cmd"
fi
run_remote "systemctl --user restart \"$unit\""
tries=0
while true; do
  state="$(run_remote "systemctl --user is-active \"$unit\"" || true)"
  if [ "$state" = "active" ]; then
    break
  fi
  tries=$((tries + 1))
  if [ "$tries" -ge 20 ]; then
    echo "timed out waiting for $unit to become active (last state: $state)" >&2
    exit 1
  fi
  sleep 0.3
done
echo "$unit is active"
run_remote "cd \"$dest\" && $FORGE_CHECK"
''', "deploy-user-service"]
