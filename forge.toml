# Forge 2 verified by Forge 2. What Forge re-runs after every attempt; `setup`
# runs first and gates the rest. Its output (target/) is gitignored, as every
# setup output must be. Verified changes land on main like in any repository;
# a change a human wants to gate is queued with --no-land and proven with
# `forge integrate` before it is merged by hand.
[defaults]
base_branch = "main"
check_timeout_secs = 900

[checks]
setup = ["cargo", "build", "--workspace", "--tests"]
fmt = ["cargo", "fmt", "--all", "--check"]
clippy = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
test = ["cargo", "test", "--workspace"]

[verify]
# The client boundary is the one rule a task may not relax; forge.toml is always protected.
protected = ["tests/boundary.rs", "forge.toml"]
# Owned by verification: hidden from the coder, overlaid at verify time, must not
# exist on main. Cargo discovers tests/hidden/main.rs as one integration test
# target, so hidden tests written there run under the `test` check.
namespace = ["tests/hidden/"]
