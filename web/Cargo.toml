[package]
name = "forge-web"
version = "0.1.0"
edition = "2024"
description = "A browser client for Forge. Speaks only the JSON the forge CLI emits and acts only through forge verbs."

[[bin]]
name = "forge-web"
path = "src/main.rs"

[dependencies]
anyhow = "1"
forge-client = { path = "../client" }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
