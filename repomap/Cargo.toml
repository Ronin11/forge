[package]
name = "forge-repomap"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "A deterministic map of a repository for a coding agent: symbols per file, ranked against a task, cut to a budget. No model, no kernel."

[[bin]]
name = "forge-repomap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
