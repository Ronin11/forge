#cloud-config
package_update: true
package_upgrade: true
packages: [caddy, rsync, git, curl, ca-certificates, build-essential, python3, unattended-upgrades]
users:
  - name: equitizr
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "<the forge-deploy public key>"
      - "<the operator public key>"
write_files:
  - path: /etc/caddy/Caddyfile
    permissions: "0644"
    content: |
      {
        acme_ca https://acme-v02.api.letsencrypt.org/directory
      }
      equitizr.com, www.equitizr.com {
        encode zstd gzip
        reverse_proxy 127.0.0.1:3000
      }
  - path: /home/equitizr/.config/systemd/user/equitizr.service
    permissions: "0644"
    defer: true
    content: |
      [Unit]
      Description=Equitizr (Next.js)
      After=network.target
      [Service]
      WorkingDirectory=%h/app
      Environment=NODE_ENV=production
      Environment=PORT=3000
      Environment=EQUITIZR_READONLY=1
      Environment=EQUITIZR_DB=%h/data/equitizr.db
      Environment=NEXT_PUBLIC_SITE_URL=https://equitizr.com
      ExecStart=%h/.local/bin/mise exec -- npm run start
      Restart=on-failure
      RestartSec=3
      [Install]
      WantedBy=default.target
runcmd:
  - loginctl enable-linger equitizr
  - mkdir -p /home/equitizr/app /home/equitizr/data /home/equitizr/.config/systemd/user
  - chown -R equitizr:equitizr /home/equitizr
  - sudo -u equitizr -H bash -lc 'curl -fsSL https://mise.run | sh && ~/.local/bin/mise use -g node@22 >/dev/null 2>&1 && ~/.local/bin/mise exec -- node --version > ~/node-version.txt'
  # Debian 12 ships caddy 2.6.2 (2022), which fails against Let's Encrypt's
  # current ACME endpoints ("downloading certificate chain … 404") and then
  # falls back to the staging CA. Replace the binary with the current release
  # before the first start; the package's unit and user are kept.
  - bash -c 'v=$(curl -s https://api.github.com/repos/caddyserver/caddy/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)[\"tag_name\"])"); cd /tmp && curl -sL "https://github.com/caddyserver/caddy/releases/download/${v}/caddy_${v#v}_linux_amd64.tar.gz" -o caddy.tgz && tar -xzf caddy.tgz caddy && install -m 755 caddy /usr/bin/caddy && rm -f caddy caddy.tgz'
  - systemctl enable --now caddy
  - systemctl restart caddy
  - touch /home/equitizr/.provisioned
