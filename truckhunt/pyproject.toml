[project]
name = "truckhunt"
version = "0.1.0"
description = "Find used comma.ai-supported pickups on KSL Cars and Facebook Marketplace"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45"]

[project.scripts]
truckhunt = "truckhunt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truckhunt = ["supported_trucks.json", "config.example.toml"]
